<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kaiten Test Add-on Panel</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button { padding: 8px 10px; cursor: pointer; }
    #log { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; background: #f6f8fa; border: 1px solid #e5e7eb; padding: 8px; border-radius: 6px; height: 140px; overflow: auto; }
    .muted { color: #6b7280; font-size: 12px; }
  </style>
</head>
<body>
  <div class="muted">kaiten-addon-test: iframe panel (served from your server)</div>
  <h3 style="margin: 8px 0 10px;">Test panel</h3>

  <div class="row" style="margin-bottom: 10px;">
    <button id="btnPing">Ping backend</button>
    <button id="btnRun">Run demo job</button>
    <button id="btnClear">Clear log</button>
  </div>

  <div id="log"></div>

  <script src="./panel.js"></script>
</body>
</html>
